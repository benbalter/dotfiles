name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to catch upstream breakage (Homebrew bottles, runner images, Fedora
  # updates) that otherwise only shows up on the next push.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - name: Ansible cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible
          key: ${{ runner.os }}-ansible-${{ hashFiles('requirements.yml') }}

      # Cache pip's wheels, not the venv: a cached venv points at the runner
      # image's Python, and breaks once the image moves to a new one.
      - name: Pip cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Bootstrap
        run: script/bootstrap

      - name: Run playbook
        run: script/ansible

      - name: Verify dotfile symlinks
        run: |
          for file in .zshrc .zprofile .gitconfig .gitignore .yamllint .Brewfile \
            .config/mise/config.toml .config/starship.toml; do
            test -L "$HOME/$file" || { echo "FAIL: $file not symlinked"; exit 1; }
            target=$(readlink "$HOME/$file")
            expected="$GITHUB_WORKSPACE/$file"
            [ "$target" = "$expected" ] || { echo "FAIL: $file -> $target (expected $expected)"; exit 1; }
          done
          echo "All dotfile symlinks verified"

      - name: Verify expected directories exist
        run: |
          for dir in .bundle .config .gnupg .ssh github projects \
            "Library/Application Support/com.mitchellh.ghostty"; do
            test -d "$HOME/$dir" || { echo "FAIL: ~/$dir missing"; exit 1; }
          done
          echo "All required directories present"

      - name: Verify oh-my-zsh installed
        run: test -d "$HOME/.oh-my-zsh/.git"

      - name: Verify Homebrew installed
        run: |
          command -v brew
          brew --version

      # The full Brewfile (and thus mise) is skipped in CI, so install mise
      # directly, then materialize the mise-managed runtimes and global npm CLIs
      # and assert each lands on PATH. The playbook symlinked
      # ~/.config/mise/config.toml above (verified earlier), so installing from
      # $HOME picks up that global config.
      - name: Install and verify mise-managed CLIs
        run: |
          brew install mise
          cd "$HOME"
          mise install
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          for cmd in node tsx wrangler ncu serve claude copilot zx ni degit taze; do
            command -v "$cmd" >/dev/null || { echo "FAIL: $cmd not on PATH"; exit 1; }
          done
          echo "All mise-managed CLIs verified"

      - name: Verify macOS user defaults applied
        run: |
          autohide=$(defaults read com.apple.dock autohide)
          [ "$autohide" = "1" ] || { echo "FAIL: dock autohide=$autohide (expected 1)"; exit 1; }
          ss_type=$(defaults read com.apple.screencapture type)
          [ "$ss_type" = "png" ] || { echo "FAIL: screencapture type=$ss_type (expected png)"; exit 1; }
          ask_pw=$(defaults read com.apple.screensaver askForPassword)
          [ "$ask_pw" = "1" ] || { echo "FAIL: screensaver askForPassword=$ask_pw (expected 1)"; exit 1; }
          echo "macOS user defaults verified"

      - name: Re-run playbook (no failures on second run)
        run: |
          # Re-run to catch tasks that error on a second invocation.
          # Note: not asserting changed=0 because geerlingguy.mac.dock
          # always reports changed for dock item positions.
          output=$(script/ansible 2>&1)
          echo "$output"
          failed=$(echo "$output" | awk '/^localhost/ { for (i=1; i<=NF; i++) if ($i ~ /^failed=/) print substr($i, 8) }')
          [ "$failed" = "0" ] || { echo "FAIL: re-run reported failed=$failed (expected 0)"; exit 1; }
          echo "Playbook re-run completed without failures"

  # Nothing in lint needs macOS, and an Ubuntu runner starts faster.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # bundler-cache runs `bundle install`, so script/lint's `bundle exec
      # rubocop` gets the Gemfile's pinned version.
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Ansible cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible
          key: ${{ runner.os }}-ansible-${{ hashFiles('requirements.yml') }}

      - name: Bootstrap
        run: script/bootstrap

      # shellcheck, shfmt and actionlint at the versions Homebrew has locally;
      # apt's are older and check or format differently.
      - name: Install lint tools
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          # In RUNNER_TEMP, so the unpacked files stay out of the lint run.
          cd "$RUNNER_TEMP"
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball"
          sudo install "shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/
          cd "$GITHUB_WORKSPACE"
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm ci

      - name: Lint
        run: script/lint

  unit-test:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - name: Install dependencies
        run: brew install bats-core yq

      # comic-sans.bats parses VS Code's JSONC settings via test/bin/jsonc-get,
      # which needs the jsonc-parser package from package.json.
      - name: Install node dependencies
        run: npm ci

      - name: Run tests
        run: script/test

  install-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config.
          persist-credentials: false

      # No chmod first: that would hide the missing exec bit test/scripts.bats
      # exists to catch. test/install.bats checks the links it makes against
      # config.yml.
      - name: Run install.sh
        run: ./install.sh

      - name: Verify tools installed
        run: |
          command -v delta
          command -v zoxide
          command -v fzf

      - name: Install bats and run unit tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bats
          npm ci
          script/test

  test-fedora:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A fixed release, so a new Fedora lands as a reviewable bump rather than
    # a surprise red build.
    container: fedora:44
    # GitHub sets HOME=/github/home for container jobs, but Ansible's user_dir
    # (and the shell verify steps below) resolve to root's real home, /root.
    # Pin HOME=/root so ~ expansion, ansible_facts.user_dir, and $HOME all agree
    # — matching a real Fedora/Asahi machine where HOME == the user's home.
    env:
      HOME: /root

    steps:
      - name: Install bootstrap dependencies
        run: dnf install -y git python3 python3-pip sudo

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - name: Bootstrap
        run: script/bootstrap

      - name: Run playbook
        run: script/ansible

      - name: Verify dotfile symlinks
        run: |
          for file in .zshrc .zprofile .gitconfig .gitconfig.linux .gitignore \
            .yamllint .config/mise/config.toml .config/starship.toml \
            .config/ghostty/config .ssh/config; do
            test -L "$HOME/$file" || { echo "FAIL: $file not symlinked"; exit 1; }
          done
          echo "All dotfile symlinks verified"

      - name: Verify macOS-only dotfiles were not symlinked
        run: |
          for file in .Brewfile .gitconfig.macos .mackup.cfg; do
            test ! -e "$HOME/$file" || { echo "FAIL: $file should not exist on Linux"; exit 1; }
          done
          echo "No macOS dotfiles leaked"

      # Homebrew (and the Brewfile toolchain) is gated to non-CI runs because
      # this Fedora container is root and Homebrew refuses to run as root.
      # Here we only verify the dnf bootstrap set; the test-asahi-brew job
      # exercises the Brewfile on Linux as a non-root user.
      - name: Verify bootstrap packages installed
        run: |
          for cmd in zsh git gcc make curl ps; do
            command -v "$cmd" || { echo "FAIL: $cmd not installed"; exit 1; }
          done

      - name: Verify oh-my-zsh installed
        run: test -d "$HOME/.oh-my-zsh/.git"

      - name: Verify zsh loads cleanly
        run: |
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.files"
          zsh -ic 'echo "zsh ok"'

      - name: Re-run playbook (no failures on second run)
        run: |
          output=$(script/ansible 2>&1)
          echo "$output"
          failed=$(echo "$output" | awk '/^localhost/ { for (i=1; i<=NF; i++) if ($i ~ /^failed=/) print substr($i, 8) }')
          [ "$failed" = "0" ] || { echo "FAIL: re-run reported failed=$failed (expected 0)"; exit 1; }
          echo "Playbook re-run completed without failures"

  # Validates that the Brewfile runs under `brew bundle` on Linux the way it
  # would on Asahi (Fedora aarch64), as a non-root user. Runs on both x86_64 and
  # native aarch64 GitHub-hosted runners — the aarch64 leg matches Asahi's
  # architecture and confirms arm64_linux bottles actually install. This proves
  # the Brewfile parses, that macOS-only entries are skipped, and that bottles
  # install on both arches; the full playbook wiring is still verified on real
  # hardware.
  test-asahi-brew:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config.
          persist-credentials: false

      # Formulae with no Linux bottle, read from config.yml rather than copied
      # here, as script/update does.
      - name: Read the Linux brew skip list
        run: |
          echo "HOMEBREW_BUNDLE_BREW_SKIP=$(sed -n 's/^homebrew_linux_brew_skip: *//p' config.yml)" >> "$GITHUB_ENV"

      # ARM64 runner images don't ship Homebrew preinstalled like x86_64 ones do.
      - name: Ensure Homebrew is installed
        run: |
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

      - name: Brewfile parses under brew bundle on Linux
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew bundle list --file=Brewfile --all >/dev/null
          echo "Brewfile parses"

      - name: macOS-only entries are skipped, not errors, on Linux
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # A Brewfile of only macOS-specific entries must install cleanly on
          # Linux: the three bottle-less formulae via HOMEBREW_BUNDLE_BREW_SKIP,
          # and cask/mas entries via brew bundle's automatic Linux skip.
          cat > "$RUNNER_TEMP/Brewfile.macos-only" <<'EOF'
          brew 'dockutil'
          brew 'pinentry-mac'
          brew 'mas'
          cask '1password'
          mas '1Password for Safari', id: 1_569_813_296
          EOF
          brew bundle install --file="$RUNNER_TEMP/Brewfile.macos-only"
          echo "macOS-only entries skipped cleanly on Linux"

      - name: Install a representative subset (proves Linux bottles install)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install gh jq ripgrep
          for cmd in gh jq rg; do
            command -v "$cmd" || { echo "FAIL: $cmd not installed via Homebrew"; exit 1; }
          done
          echo "Homebrew Linux bottles install correctly"

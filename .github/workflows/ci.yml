name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to catch upstream breakage (Homebrew bottles, runner images) that
  # otherwise only shows up on the next push.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read

# Cancel superseded PR runs only: cancelling on main left some commits there
# without a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - name: Ansible cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible
          key: ${{ runner.os }}-ansible-${{ hashFiles('requirements.yml') }}

      # Cache pip's wheels, not the venv: a cached venv points at the runner
      # image's Python, and breaks once the image moves to a new one.
      - name: Pip cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Bootstrap
        run: script/bootstrap

      - name: Run playbook
        run: script/ansible

      - name: Verify dotfile symlinks
        run: |
          for file in .zshrc .zprofile .gitconfig .gitignore .yamllint .Brewfile \
            .config/mise/config.toml .config/starship.toml; do
            test -L "$HOME/$file" || { echo "FAIL: $file not symlinked"; exit 1; }
            target=$(readlink "$HOME/$file")
            expected="$GITHUB_WORKSPACE/$file"
            [ "$target" = "$expected" ] || { echo "FAIL: $file -> $target (expected $expected)"; exit 1; }
          done
          echo "All dotfile symlinks verified"

      - name: Verify expected directories exist
        run: |
          for dir in .bundle .config .gnupg .ssh github projects \
            "Library/Application Support/com.mitchellh.ghostty"; do
            test -d "$HOME/$dir" || { echo "FAIL: ~/$dir missing"; exit 1; }
          done
          echo "All required directories present"

      - name: Verify oh-my-zsh installed
        run: test -d "$HOME/.oh-my-zsh/.git"

      # `zsh -ic 'echo ok'` passed whatever .zshrc printed to stderr, so fail
      # on any stderr at all.
      - name: Verify zsh loads cleanly
        run: |
          err=$(zsh -ic exit 2>&1 >/dev/null)
          [ -z "$err" ] || { echo "$err"; exit 1; }

      - name: Verify Homebrew installed
        run: |
          command -v brew
          brew --version

      # The full Brewfile (and thus mise) is skipped in CI, so install mise
      # directly, then materialize the mise-managed runtimes and global npm CLIs
      # and assert each lands on PATH. The playbook symlinked
      # ~/.config/mise/config.toml above (verified earlier), so installing from
      # $HOME picks up that global config.
      - name: mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('.config/mise/config.toml') }}

      - name: Install and verify mise-managed CLIs
        run: |
          brew install mise
          cd "$HOME"
          mise install
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          for cmd in node tsx wrangler ncu serve claude copilot zx ni degit taze \
            tsc typescript-language-server chrome-devtools-mcp skills; do
            command -v "$cmd" >/dev/null || { echo "FAIL: $cmd not on PATH"; exit 1; }
          done
          echo "All mise-managed CLIs verified"

      - name: Verify macOS user defaults applied
        run: |
          autohide=$(defaults read com.apple.dock autohide)
          [ "$autohide" = "1" ] || { echo "FAIL: dock autohide=$autohide (expected 1)"; exit 1; }
          ss_type=$(defaults read com.apple.screencapture type)
          [ "$ss_type" = "png" ] || { echo "FAIL: screencapture type=$ss_type (expected png)"; exit 1; }
          ask_pw=$(defaults read com.apple.screensaver askForPassword)
          [ "$ask_pw" = "1" ] || { echo "FAIL: screensaver askForPassword=$ask_pw (expected 1)"; exit 1; }
          echo "macOS user defaults verified"

      # A second run must neither fail nor change anything. The dock role is
      # skipped: geerlingguy.mac.dock always reports changed for item positions.
      - name: Re-run playbook (idempotent)
        run: |
          output=$(script/ansible --skip-tags dock 2>&1)
          echo "$output"
          recap() { echo "$output" | awk -v k="$1=" '/^localhost/ { for (i=1; i<=NF; i++) if (index($i, k) == 1) print substr($i, length(k) + 1) }'; }
          [ "$(recap failed)" = "0" ] || { echo "FAIL: re-run reported failed=$(recap failed)"; exit 1; }
          [ "$(recap changed)" = "0" ] || { echo "FAIL: re-run reported changed=$(recap changed) (expected 0)"; exit 1; }
          echo "Playbook re-run was idempotent"

  # Nothing in lint needs macOS, and an Ubuntu runner starts faster.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # bundler-cache runs `bundle install`, so script/lint's `bundle exec
      # rubocop` gets the Gemfile's pinned version.
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Ansible cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible
          key: ${{ runner.os }}-ansible-${{ hashFiles('requirements.yml') }}

      - name: Bootstrap
        run: script/bootstrap

      # zsh: script/lint syntax-checks the zsh files.
      - name: Install lint tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zsh
          script/install-lint-tools
          npm ci

      - name: Lint
        run: script/lint

  unit-test:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - name: Install dependencies
        run: brew install bats-core yq

      # comic-sans.bats parses VS Code's JSONC settings via test/bin/jsonc-get,
      # which needs the jsonc-parser package from package.json.
      - name: Install node dependencies
        run: npm ci

      - name: Run tests
        run: script/test

  # The Codespaces path: Linux only ever gets install.sh, not the playbook.
  install-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config.
          persist-credentials: false

      # No chmod first: that would hide the missing exec bit test/scripts.bats
      # exists to catch. test/install.bats checks the links it makes against
      # config.yml.
      # Codespaces images ship zsh and bats; the runner image doesn't.
      - name: Install zsh and bats
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zsh bats

      - name: Run install.sh
        run: ./install.sh

      # A second run must succeed over the first one's links, as a rebuilt
      # Codespace does.
      - name: Re-run install.sh
        run: ./install.sh

      - name: Verify tools installed
        run: |
          command -v delta
          command -v zoxide
          command -v fzf
          command -v yq

      - name: Verify zsh loads cleanly
        run: |
          err=$(zsh -ic exit 2>&1 >/dev/null)
          [ -z "$err" ] || { echo "$err"; exit 1; }

      - name: Run script/doctor
        run: script/doctor

      # Codespaces sets up its own commit signing, so nothing linked here may
      # turn signing on (a 1Password SSH signer made every commit fail).
      - name: Verify git can commit
        run: |
          repo=$(mktemp -d)
          git -C "$repo" init -q
          git -C "$repo" -c core.pager=cat commit -q --allow-empty -m test

      - name: Run unit tests
        run: |
          npm ci
          script/test

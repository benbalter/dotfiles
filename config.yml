---
dockitems_persist:
  - name: Google Chrome
    path: "/Applications/Google Chrome.app/"
    pos: 1
  - name: Spotify
    path: "/Applications/Spotify.app/"
    pos: 5
  - name: Visual Studio Code
    path: "/Applications/Visual Studio Code.app/"
    pos: 6
  - name: Slack
    path: "/Applications/Slack.app/"
    pos: 7
dockitems_remove:
  - Launchpad
  - Mail
  - Contacts
  - Calendar
  - Notes
  - Reminders
  - Maps
  - Photos
  - Messages
  - FaceTime
  - Music
  - Podcasts
  - TV
  - News
  - Books
  - "App Store"
  - "System Settings"

# Dotfiles symlinked into $HOME everywhere: by the playbook on macOS and by
# install.sh on Linux (Codespaces), which must list the same files
dotfiles_files_common:
  - .bundle/config
  - .default-gems
  - .digrc
  - .gemrc
  - .gitconfig
  - .gitignore
  - .gnupg/gpg.conf
  - .hushlogin
  - .irbrc
  - .npmrc
  - .pryrc
  - .remarkrc
  - .ripgreprc
  - .yamllint
  - .zprofile
  - .zshenv
  - .zshrc
  - .config/atuin/config.toml
  - .config/bat/config
  - .config/git/allowed_signers
  - .config/git/attributes
  - .config/mise/config.toml
  - .config/starship.toml
  - .config/zed/settings.json

# Dotfiles symlinked into $HOME on macOS only; install.sh skips them
dotfiles_files_macos:
  - .Brewfile
  # Just these files: mole writes generated reports (clean-list.txt) beside them
  - .config/mole/purge_paths
  - .config/mole/whitelist
  - .config/mole/whitelist_optimize
  - .gitconfig.macos
  # init.templateDir in .gitconfig.macos: the gitleaks pre-commit hook
  - .config/git/template
  - .gnupg/gpg-agent.conf
  # The directory, not karabiner.json: Karabiner saves by replacing the file,
  # which would swap a file symlink for a regular file.
  - .config/karabiner
  - .ssh/config
  - Library/Application Support/Code/User/settings.json
  - Library/Application Support/Code/User/keybindings.json
  - Library/Application Support/Code/User/mcp.json
  - Library/Application Support/com.mitchellh.ghostty/config
  - Library/Application Support/com.mitchellh.ghostty/shaders/bloom.glsl
  - Library/Spelling/LocalDictionary
  - Library/LaunchAgents/com.balter.ben.tmpreaper.plist
  - Library/LaunchAgents/com.balter.ben.update.plist

# Symlinks, everywhere, whose destination differs from the repo path
# (kept out of the repo's own .claude/ so they don't double as project config)
dotfile_links_common:
  - src: claude/CLAUDE.md
    dest: .claude/CLAUDE.md
  - src: claude/skills/roll-for-initiative
    dest: .claude/skills/roll-for-initiative
  - src: Library/Application Support/com.mitchellh.ghostty/themes/catppuccin-latte.conf
    dest: .config/ghostty/themes/catppuccin-latte.conf
  - src: Library/Application Support/com.mitchellh.ghostty/themes/catppuccin-mocha.conf
    dest: .config/ghostty/themes/catppuccin-mocha.conf

dotfiles_files: "{{ dotfiles_files_common + dotfiles_files_macos }}"

# Dotfiles the repo no longer ships. The playbook removes each $HOME link, but
# only while it still points into this repo, so a real file put there by hand
# survives. Removing the file from the repo alone left a dangling symlink.
dotfiles_retired:
  # Mackup's Dropbox backup went stale for years, and a `mackup restore`
  # would replace repo-managed links (.pryrc, .npmrc) with old copies.
  - .mackup.cfg

dotfile_root_dirs:
  - ""
  - "."

# Directories under $HOME (relative paths) that must be 0700 rather than 0755.
# gpg refuses to trust a group/world-readable homedir ("unsafe permissions on
# homedir") and ssh expects the same of ~/.ssh. Every task that creates one of
# these -- directories_to_create and the dotfile parent-dir tasks -- takes its
# mode from this list, so they don't flip it back and forth on each run.
# projects and github hold checkouts with private data. The playbook makes the
# home folder itself 0700, so other logins can't read them; these stay private
# too in case a macOS update resets home to its default 0750.
private_directories:
  - .gnupg
  - .ssh
  - github
  - projects

directories_to_create_common:
  - ~/.bundle
  - ~/.config
  - ~/.gnupg
  - ~/.ssh
  - ~/github
  - ~/projects

directories_to_create_macos:
  - ~/Library/Application Support/Code/User
  - ~/Library/Application Support/com.mitchellh.ghostty
  - ~/Library/LaunchAgents
  - ~/Library/Spelling

directories_to_create: "{{ directories_to_create_common + directories_to_create_macos }}"

macos_defaults:
  # Every entry here is applied with `become: true`. A BARE domain in that
  # context makes `defaults write` run as root with HOME=/var/root, so the value
  # lands in root's personal preferences (/var/root/Library/Preferences/) and
  # affects nothing -- while Ansible still reports the task green. System
  # settings must therefore use an absolute /Library/Preferences/<domain> path.
  # The playbook verifies each key afterwards so this cannot silently regress.
  system:
    - name: App Store Auto-update
      domain: /Library/Preferences/com.apple.commerce
      key: AutoUpdate
      type: bool
      value: true
    # No AutomaticCheckEnabled here: softwareupdated strips it from this file,
    # so it only read back right after the write. The playbook's security block
    # drives it through `softwareupdate --schedule` instead. The pre-Mojave
    # com.apple.commerce AutoUpdateRestartRequired key went the same way.
    - name: Set lock screen message
      domain: /Library/Preferences/com.apple.loginwindow
      key: LoginwindowText
      value: "Found this computer? Please contact Ben Balter at ben@balter.com."
      type: string
    # Firewall settings are NOT set here. The com.apple.alf plist is vestigial
    # on modern macOS -- the Application Firewall is an NEContentFilter now, so
    # `defaults write` lands in a file nothing reads and reports green forever.
    # See the "Configure firewall" block in playbook.yml, which drives
    # socketfilterfw and verifies the result.
    - name: Auto-download updates
      domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: AutomaticDownload
      type: integer
      value: 1
    - name: Auto-install macOS updates
      domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: AutomaticallyInstallMacOSUpdates
      type: bool
      value: true
    - name: Install config data updates
      domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: ConfigDataInstall
      type: bool
      value: true
    - name: Install critical security updates
      domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: CriticalUpdateInstall
      type: integer
      value: 1
    - name: Library validation
      domain: /Library/Preferences/com.apple.security.libraryvalidation
      key: DisableLibraryValidation
      type: bool
      value: false
    # `com.apple.MCX DisableGuestAccount` used to live here. It is inert on
    # modern macOS -- MCX is the managed-preferences domain, written by MDM, not
    # by `defaults`. `GuestEnabled` below is the control that actually works.
    - name: Disable guest login
      domain: /Library/Preferences/com.apple.loginwindow
      key: GuestEnabled
      type: bool
      value: false
    - name: Login window show name and password
      domain: /Library/Preferences/com.apple.loginwindow
      key: SHOWFULLNAME
      type: bool
      value: true
    - name: Disable password hints
      domain: /Library/Preferences/com.apple.loginwindow
      key: RetriesUntilHint
      type: integer
      value: 0
  # Applied to the account running the playbook. Entries with `all_users: true`
  # are a security baseline that the playbook also writes, as each user, for
  # every other local login. The rest are personal taste and stay on this account
  # only. An all_users value must not template user_dir, which is this account's
  # home.
  user:
    - name: Hot corner
      domain: com.apple.dock
      key: wvous-br-corner
      type: integer
      value: 5
    - name: Auto hide dock
      domain: com.apple.dock
      key: autohide
      type: bool
      value: true
    # These belong to com.apple.screensaver, not com.apple.dock -- they were
    # written to the dock domain for years, where nothing reads them. Note macOS
    # 14+ increasingly defers screen-lock timing to System Settings/MDM, so
    # treat these as best-effort rather than a guarantee.
    - name: Screensaver ask for password
      domain: com.apple.screensaver
      key: askForPassword
      type: bool
      value: true
      all_users: true
    - name: Screensaver delay
      domain: com.apple.screensaver
      key: askForPasswordDelay
      type: integer
      value: 0
      all_users: true
    # Replaces the legacy system-level `com.apple.AdLib forceLimitAdTracking`.
    # Personalized-ad opt-out is a per-user preference on modern macOS.
    - name: Limit ad tracking
      domain: com.apple.AdLib
      key: allowApplePersonalizedAdvertising
      type: bool
      value: false
      all_users: true
    - name: Screenshot location
      domain: com.apple.screencapture
      key: location
      type: string
      # Absolute: osx_defaults doesn't go through a shell, so ~ was stored
      # literally and only worked because Desktop is the default anyway.
      value: "{{ ansible_facts['user_dir'] }}/Desktop"
    - name: Screenshot format
      domain: com.apple.screencapture
      key: type
      type: string
      value: png
    # The screensaver reads idleTime from the per-host (ByHost) domain; a plain
    # `defaults write` puts it in the global user domain, where it was set for
    # years without the ByHost domain ever existing. Best-effort for the same
    # reason as the lock-timing keys above.
    - name: Screensaver idle time
      domain: com.apple.screensaver
      key: idleTime
      type: integer
      value: 300
      host: currentHost
      all_users: true
    # On by default, AirPlay Receiver keeps Control Center listening on ports
    # 5000 and 7000 on every interface, for casting to this Mac, which nobody
    # does. The key is spelled correctly now: older guides' misspelled
    # AirplayRecieverEnabled is in no system binary. Verified by the ports
    # closing once Control Center restarts.
    - name: AirPlay Receiver off
      domain: com.apple.controlcenter
      key: AirplayReceiverEnabled
      type: bool
      value: false
      host: currentHost
      all_users: true
    - name: Secure keyboard entry in Terminal
      domain: com.apple.Terminal
      key: SecureKeyboardEntry
      type: bool
      value: true
      all_users: true
    # `mo optimize` sets this too, but a fresh machine shouldn't depend on
    # mole having run to stop Finder littering shared drives. Its USB sibling,
    # DSDontWriteUSBStores, is gone: script/audit-defaults found it (and even
    # "USBStores") in no system binary, so nothing reads it.
    - name: No .DS_Store on network volumes
      domain: com.apple.desktopservices
      key: DSDontWriteNetworkStores
      type: bool
      value: true
      all_users: true
    # Off, the macOS default: on, it also overrides each app's hidden-extension
    # flag, so Finder, Spotlight and Open dialogs showed "Slack.app". There's no
    # apps-only exception. Gatekeeper and notarization already stop most
    # "invoice.pdf.app" disguises, and Finder's Kind column still says
    # Application.
    - name: Respect per-file hidden extensions
      domain: NSGlobalDomain
      key: AppleShowAllExtensions
      type: bool
      value: false
    - name: Finder path bar
      domain: com.apple.finder
      key: ShowPathbar
      type: bool
      value: true
    - name: Finder status bar
      domain: com.apple.finder
      key: ShowStatusBar
      type: bool
      value: true
    - name: Finder list view
      domain: com.apple.finder
      key: FXPreferredViewStyle
      type: string
      value: Nlsv
    - name: Finder folders first
      domain: com.apple.finder
      key: _FXSortFoldersFirst
      type: bool
      value: true
    # Pinned at their current (on) values rather than changed: these are typing
    # habits, and a fresh machine should match this one, not a guess.
    - name: Auto-capitalization
      domain: NSGlobalDomain
      key: NSAutomaticCapitalizationEnabled
      type: bool
      value: true
    - name: Double-space inserts a period
      domain: NSGlobalDomain
      key: NSAutomaticPeriodSubstitutionEnabled
      type: bool
      value: true
    # Choices made in System Settings that differ from the macOS defaults.
    - name: Dark mode
      domain: NSGlobalDomain
      key: AppleInterfaceStyle
      type: string
      value: Dark
    - name: Liquid Glass tint
      domain: NSGlobalDomain
      key: NSGlassTintAmount
      type: float
      value: 0.5
    - name: No swipe between pages
      domain: NSGlobalDomain
      key: AppleEnableSwipeNavigateWithScrolls
      type: bool
      value: false
    - name: Hide the menu bar in full screen
      domain: NSGlobalDomain
      key: AppleMenuBarVisibleInFullscreen
      type: bool
      value: false
    - name: List view in Open dialogs
      domain: NSGlobalDomain
      key: NavPanelFileListModeForOpenMode
      type: integer
      value: 2
    - name: Dock icon size
      domain: com.apple.dock
      key: tilesize
      type: float
      value: 64
    # Changes from the macOS defaults, borrowed from mathiasbynens/dotfiles'
    # .macos. script/audit-defaults found each key in a current system binary.
    - name: No recent apps in the Dock
      domain: com.apple.dock
      key: show-recents
      type: bool
      value: false
    - name: Finder searches the current folder
      domain: com.apple.finder
      key: FXDefaultSearchScope
      type: string
      value: SCcf
    - name: No warning when changing a file extension
      domain: com.apple.finder
      key: FXEnableExtensionChangeWarning
      type: bool
      value: false
    - name: New documents save to disk, not iCloud
      domain: NSGlobalDomain
      key: NSDocumentSaveNewDocumentsToCloud
      type: bool
      value: false
  # Keys that were written to the wrong domain for years. Removing them keeps a
  # stale value from shadowing the correct one if Apple ever starts reading it.
  absent:
    - name: Stale screensaver password flag on the dock domain
      domain: com.apple.dock
      key: askForPassword
    - name: Stale screensaver delay on the dock domain
      domain: com.apple.dock
      key: askForPasswordDelay
    - name: Screensaver idle time in the global domain (belongs in ByHost)
      domain: com.apple.screensaver
      key: idleTime

# Desktop icons' Finder "Sort By" (#23): name, kind, dateAdded,
# dateModified, dateCreated, size, label, grid (snap only) or none. It lives
# in a nested dict that osx_defaults can't write, so the playbook sets it
# with PlistBuddy instead of through macos_defaults.
macos_desktop_arrange_by: name

# This Mac's names, set with scutil. ComputerName is the one shown in
# Finder, AirDrop and Find My; LocalHostName is the Bonjour name (.local).
# macOS appends -2 to LocalHostName when it sees another Mac using the name,
# which had stuck after a migration. HostName stays unset, so macOS keeps
# deriving it from the network.
computer_names:
  ComputerName: "Ben’s MacBook Pro"
  LocalHostName: Bens-MacBook-Pro

# Apps that open at login, by path. The playbook adds any that are missing
# and never removes one, so an item added by hand survives until it's
# listed here or removed in System Settings.
login_items:
  - /Applications/Caffeine.app
  - /Applications/CleanShot X.app
  - /Applications/Elgato Control Center.app
  - /Applications/Google Drive.app
  - /Applications/MuteDeck/MuteDeck.app
  - /Applications/On Air Mode.app
  - /Applications/Thaw.app
  - /Applications/Unclack.app
  - /Applications/WhatCable.app

# Backed up nightly by script/backup (restic, encrypted before it leaves this
# Mac), relative to $HOME; globs allowed. Only what exists nowhere else: never
# Claude Code's transcripts or history.jsonl, which hold everything ever pasted
# into a session, secrets included.
backup_paths:
  - .claude/plans
  - .claude/projects/*/memory
  - Library/Application Support/com.elgato.StreamDeck/ProfilesV3

# Launch agents third-party apps install in ~/Library/LaunchAgents to start
# themselves at login, by label. The playbook unloads and deletes them, and
# script/doctor warns if one comes back. Camera Hub has no setting for this:
# its autostart checkbox just writes the agent, which kept it (and the network
# listener it runs) going in the background at every login.
launch_agents_removed:
  - com.elgato.CameraHub

# Default apps, by bundle ID: URL schemes and file types (UTIs). Applied with
# utiluti only where they differ, since macOS asks to confirm each change.
# Setting http also sets https and public.html, which can't be set directly.
# App-registered schemes (zoomphonecall, steam, ...) are left to their apps.
default_apps:
  urls:
    http: com.google.Chrome
    mailto: com.google.Chrome
    webcal: com.google.Chrome
  types:
    public.unix-executable: com.mitchellh.ghostty

# Security settings that only their CLIs can change. The playbook runs `check`,
# runs `set` (as root) unless the output matches `expect` (or no longer matches
# `reject`), then checks again; script/doctor runs the same `check`. One list,
# so the setter, its read-back and doctor can't drift apart. Patterns are
# extended regexes that also work as Python's (no [[:space:]]), since Ansible
# and grep -E both read them. `work: true` keeps a setting on a work Mac, whose
# other security settings belong to IT's MDM. `hint` explains a failure.
macos_security_settings:
  - name: Gatekeeper
    check: spctl --status
    expect: assessments enabled
    set: spctl --global-enable
    work: true
  - name: automatic update checks
    # Not `defaults`: softwareupdated strips AutomaticCheckEnabled after a write.
    check: softwareupdate --schedule
    expect: turned on
    set: softwareupdate --schedule on
  - name: firewall
    check: socketfilterfw --getglobalstate
    expect: State = 1
    set: socketfilterfw --setglobalstate on
  - name: firewall stealth mode
    check: socketfilterfw --getstealthmode
    expect: stealth mode is on
    set: socketfilterfw --setstealthmode on
  - name: wake for network access
    # Off until Find My Mac replaced an anti-theft agent; without it, Find My
    # can't locate, lock or erase a sleeping Mac. Being wakeable opens nothing:
    # the stealth-mode firewall still drops unsolicited traffic. -g custom
    # reads every power source, not just the current one, as -a sets them.
    check: pmset -g custom
    reject: womp +0
    set: pmset -a womp 1
    hint: Find My can't lock or erase a sleeping Mac without it

# Application Firewall policy. macOS defaults to auto-allowing any *downloaded*
# signed (notarized) app to accept inbound connections, which quietly undoes
# much of the point of turning the firewall on -- Dropbox, Spotify and friends
# are admitted without ever asking. Turning it off means each app prompts once
# the first time it wants to listen. Set this back to true if the prompts are
# not worth it to you.
macos_firewall_allow_signed_builtin: true
macos_firewall_allow_signed_downloaded: false

# Third-party apps allowed incoming connections. Each "Allow" click in a
# firewall prompt adds an entry, so the playbook removes allowed entries that
# aren't covered here (and entries for apps that no longer exist), and
# script/doctor warns about them; see script/firewall-extras. An entry covers
# everything inside it. Add an app here when it really needs to be reachable
# from the network, not just to stop a prompt.
firewall_allowed_apps:
  # Chrome: asked again right after the playbook removed it, so something
  # (Cast discovery, peer-to-peer Meet calls) wants incoming connections.
  - /Applications/Google Chrome.app
  # Spotify Connect: phones on the network find and control this Mac.
  - /Applications/Spotify.app

# launchd system daemons kept disabled: Remote Login (sshd) and Screen
# Sharing. Remove an entry here and re-enable it in System Settings if you need
# to reach this machine remotely.
macos_disabled_daemons:
  - com.openssh.sshd
  - com.apple.screensharing
  # Services CIS Level 1 wants disabled that were merely off: NFS server,
  # Remote Apple Events and SMB file sharing. Disabled, their System Settings
  # toggles do nothing until the entry is removed here.
  - com.apple.nfsd
  - com.apple.AEServer
  - com.apple.smbd

# Require an administrator password for every system-wide System Settings pane,
# rather than letting one unlock be shared across panes and processes (CIS
# macOS benchmark). Set to false if the extra prompts aren't worth it.
macos_require_admin_for_system_settings: true
# The rights that setting covers: the parent and every pane with its own right.
# Only the first used to be set, leaving five panes on a shared unlock, which
# the CIS Level 1 audit caught.
macos_system_settings_rights:
  - system.preferences
  - system.preferences.energysaver
  - system.preferences.network
  - system.preferences.printing
  - system.preferences.sharing
  - system.preferences.softwareupdate
  - system.preferences.startupdisk
  - system.preferences.timemachine

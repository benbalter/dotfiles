---
dockitems_persist:
  - name: Google Chrome
    path: "/Applications/Google Chrome.app/"
    pos: 1
  - name: Spotify
    path: "/Applications/Spotify.app/"
    pos: 5
  - name: Visual Studio Code
    path: "/Applications/Visual Studio Code.app/"
    pos: 6
  - name: Slack
    path: "/Applications/Slack.app/"
    pos: 7
dockitems_remove:
  - Launchpad
  - Mail
  - Contacts
  - Calendar
  - Notes
  - Reminders
  - Maps
  - Photos
  - Messages
  - FaceTime
  - Music
  - Podcasts
  - TV
  - News
  - Books
  - "App Store"
  - "System Settings"

# Dotfiles symlinked into $HOME on every platform
dotfiles_files_common:
  - .bundle/config
  - .default-gems
  - .digrc
  - .gemrc
  - .gitconfig
  - .gitignore
  - .gnupg/gpg.conf
  - .hushlogin
  - .irbrc
  - .npmrc
  - .pryrc
  - .remarkrc
  - .ripgreprc
  - .yamllint
  - .zprofile
  - .zshrc
  - .config/atuin/config.toml
  - .config/bat/config
  - .config/git/allowed_signers
  - .config/git/attributes
  - .config/mise/config.toml
  - .config/starship.toml
  - .config/zed/settings.json

# Dotfiles symlinked into $HOME on macOS only
dotfiles_files_macos:
  - .Brewfile
  - .gitconfig.macos
  - .gnupg/gpg-agent.conf
  - .mackup.cfg
  - .ssh/config
  - Library/Application Support/Code/User/settings.json
  - Library/Application Support/com.mitchellh.ghostty/config
  - Library/Application Support/com.mitchellh.ghostty/shaders/bloom.glsl
  - Library/Spelling/LocalDictionary
  - Library/LaunchAgents/com.balter.ben.tmpreaper.plist
  - Library/LaunchAgents/com.balter.ben.update.plist

# Dotfiles symlinked into $HOME on Linux only
dotfiles_files_linux:
  - .gitconfig.linux

# Symlinks on every platform whose destination differs from the repo path
# (kept out of the repo's own .claude/ so they don't double as project config)
dotfile_links_common:
  - src: claude/CLAUDE.md
    dest: .claude/CLAUDE.md

# Linux symlinks whose destination differs from the repo path
# (configs shared with macOS but expected at XDG paths on Linux)
linux_dotfile_links:
  - src: .ssh/config.linux
    dest: .ssh/config
  - src: Library/Application Support/Code/User/settings.json
    dest: .config/Code/User/settings.json
  - src: Library/Application Support/com.mitchellh.ghostty/config
    dest: .config/ghostty/config
  - src: Library/Application Support/com.mitchellh.ghostty/shaders/bloom.glsl
    dest: .config/ghostty/shaders/bloom.glsl

dotfile_links: "{{ dotfile_links_common + ([] if is_macos else linux_dotfile_links) }}"

dotfiles_files: "{{ dotfiles_files_common + (dotfiles_files_macos if is_macos else dotfiles_files_linux) }}"

dotfile_root_dirs:
  - ""
  - "."

homebrew_upgrade_all_packages: false
homebrew_brewfile_dir: "{{ ansible_facts['user_dir'] }}/.files"

# Asahi / Fedora uses Homebrew as the source of truth, running the same
# Brewfile as macOS (Homebrew on Linux aarch64 is Tier 1 as of Homebrew 5.0).
# dnf only provides what Homebrew on Linux needs to bootstrap, the login shell,
# and the GUI apps Homebrew Cask cannot install on Linux (handled separately
# in the playbook, e.g. 1Password desktop).
fedora_packages:
  # Homebrew on Linux build/runtime prerequisites
  # (https://docs.brew.sh/Homebrew-on-Linux#requirements)
  - gcc
  - gcc-c++
  - make
  - procps-ng
  - curl
  - file
  - git
  # Sandboxing backend for Homebrew 6+ on Linux
  - bubblewrap
  # Login shell, set as the default before Homebrew runs
  - zsh

# Homebrew on Linux install prefix (used to locate `brew` in the playbook).
homebrew_linux_prefix: /home/linuxbrew/.linuxbrew

# Brewfile formulae with no Linux bottle (macOS-only); skipped on Asahi via
# HOMEBREW_BUNDLE_BREW_SKIP. Casks and Mac App Store (`mas`) entries are skipped
# automatically by `brew bundle` on Linux.
homebrew_linux_brew_skip: dockutil mas pinentry-mac

directories_to_create_common:
  - ~/.bundle
  - ~/.config
  - ~/.gnupg
  - ~/.ssh
  - ~/github
  - ~/projects

directories_to_create_macos:
  - ~/Library/Application Support/Code/User
  - ~/Library/Application Support/com.mitchellh.ghostty
  - ~/Library/LaunchAgents
  - ~/Library/Spelling

directories_to_create_linux:
  - ~/.config/Code/User
  - ~/.config/ghostty

directories_to_create: "{{ directories_to_create_common + (directories_to_create_macos if is_macos else directories_to_create_linux) }}"

macos_defaults:
  # Every entry here is applied with `become: true`. A BARE domain in that
  # context makes `defaults write` run as root with HOME=/var/root, so the value
  # lands in root's personal preferences (/var/root/Library/Preferences/) and
  # affects nothing -- while Ansible still reports the task green. System
  # settings must therefore use an absolute /Library/Preferences/<domain> path.
  # The playbook verifies each key afterwards so this cannot silently regress.
  system:
    - name: App Store Auto-update
      domain: /Library/Preferences/com.apple.commerce
      key: AutoUpdate
      type: bool
      value: true
    - name: App Store auto restart
      domain: /Library/Preferences/com.apple.commerce
      key: AutoUpdateRestartRequired
      type: bool
      value: true
    - name: App Store Auto check
      domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: AutomaticCheckEnabled
      type: bool
      value: true
    - name: Set lock screen message
      domain: /Library/Preferences/com.apple.loginwindow
      key: LoginwindowText
      value: "Found this computer? Please contact Ben Balter at ben@balter.com."
      type: string
    # Firewall settings are NOT set here. The com.apple.alf plist is vestigial
    # on modern macOS -- the Application Firewall is an NEContentFilter now, so
    # `defaults write` lands in a file nothing reads and reports green forever.
    # See the "Configure firewall" block in playbook.yml, which drives
    # socketfilterfw and verifies the result.
    - name: Auto-download updates
      domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: AutomaticDownload
      type: integer
      value: 1
    - name: Auto-install macOS updates
      domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: AutomaticallyInstallMacOSUpdates
      type: bool
      value: true
    - name: Install config data updates
      domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: ConfigDataInstall
      type: bool
      value: true
    - name: Install critical security updates
      domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: CriticalUpdateInstall
      type: integer
      value: 1
    - name: Library validation
      domain: /Library/Preferences/com.apple.security.libraryvalidation
      key: DisableLibraryValidation
      type: bool
      value: false
    # `com.apple.MCX DisableGuestAccount` used to live here. It is inert on
    # modern macOS -- MCX is the managed-preferences domain, written by MDM, not
    # by `defaults`. `GuestEnabled` below is the control that actually works.
    - name: Disable guest login
      domain: /Library/Preferences/com.apple.loginwindow
      key: GuestEnabled
      type: bool
      value: false
    - name: Login window show name and password
      domain: /Library/Preferences/com.apple.loginwindow
      key: SHOWFULLNAME
      type: bool
      value: true
    - name: Disable password hints
      domain: /Library/Preferences/com.apple.loginwindow
      key: RetriesUntilHint
      type: integer
      value: 0
  user:
    - name: Hot corner
      domain: com.apple.dock
      key: wvous-br-corner
      type: integer
      value: 5
    - name: Auto hide dock
      domain: com.apple.dock
      key: autohide
      type: bool
      value: true
    # These belong to com.apple.screensaver, not com.apple.dock -- they were
    # written to the dock domain for years, where nothing reads them. Note macOS
    # 14+ increasingly defers screen-lock timing to System Settings/MDM, so
    # treat these as best-effort rather than a guarantee.
    - name: Screensaver ask for password
      domain: com.apple.screensaver
      key: askForPassword
      type: bool
      value: true
    - name: Screensaver delay
      domain: com.apple.screensaver
      key: askForPasswordDelay
      type: integer
      value: 0
    # Replaces the legacy system-level `com.apple.AdLib forceLimitAdTracking`.
    # Personalized-ad opt-out is a per-user preference on modern macOS.
    - name: Limit ad tracking
      domain: com.apple.AdLib
      key: allowApplePersonalizedAdvertising
      type: bool
      value: false
    - name: Screenshot location
      domain: com.apple.screencapture
      key: location
      type: string
      value: ~/Desktop
    - name: Screenshot format
      domain: com.apple.screencapture
      key: type
      type: string
      value: png
    - name: Schedule auto update
      domain: com.apple.SoftwareUpdate
      key: ScheduleFrequency
      type: integer
      value: 1
    - name: Secure keyboard entry in Terminal
      domain: com.apple.Terminal
      key: SecureKeyboardEntry
      type: bool
      value: true
  # Keys that were written to the wrong domain for years. Removing them keeps a
  # stale value from shadowing the correct one if Apple ever starts reading it.
  absent:
    - name: Stale screensaver password flag on the dock domain
      domain: com.apple.dock
      key: askForPassword
    - name: Stale screensaver delay on the dock domain
      domain: com.apple.dock
      key: askForPasswordDelay

# Application Firewall policy. macOS defaults to auto-allowing any *downloaded*
# signed (notarized) app to accept inbound connections, which quietly undoes
# much of the point of turning the firewall on -- Dropbox, Spotify and friends
# are admitted without ever asking. Turning it off means each app prompts once
# the first time it wants to listen. Set this back to true if the prompts are
# not worth it to you.
macos_firewall_allow_signed_builtin: true
macos_firewall_allow_signed_downloaded: false
